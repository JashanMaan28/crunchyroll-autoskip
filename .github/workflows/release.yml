name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match manifest v$version"; exit 1; }
      - run: npm run build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.js "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
